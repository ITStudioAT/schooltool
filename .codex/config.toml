[features]
multi_agent = true

[agents]
# Codex may use sub-agents whenever they are useful, without asking first.
max_threads = 6
max_depth = 1


[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp"]
cwd = "C:\\laravel\\schooltool"

[mcp_servers.laravel-boost.tools.search-docs]
approval_mode = "approve"


[mcp_servers.vue-docs-mcp]
url = "https://mcp.vue-mcp.org/mcp"

[mcp_servers.vuetify-mcp]
url = "https://mcp.vuetifyjs.com/mcp"
