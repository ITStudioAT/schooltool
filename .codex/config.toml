[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[mcp_servers.laravel-boost]
command = "php"
args = [
    "artisan",
    "boost:mcp",
]
cwd = 'C:\laravel\schooltool'

[mcp_servers.laravel-boost.tools.search-docs]
approval_mode = "approve"

[mcp_servers.vue-docs-mcp]
url = "https://mcp.vue-mcp.org/mcp"

[mcp_servers.vuetify-mcp]
url = "https://mcp.vuetifyjs.com/mcp"

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp@latest",
]

[mcp_servers.vue-app-mcp]
url = "http://localhost:5173/__mcp/sse"
