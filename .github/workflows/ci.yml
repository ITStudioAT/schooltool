name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'preview/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  classify:
    name: Classify release changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.policy.outputs.lane }}
      base: ${{ steps.policy.outputs.base }}
      base-proven: ${{ steps.policy.outputs.base-proven }}
    steps:
      - name: Check out the exact source and its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, zip
          coverage: none
      - name: Classify against a fully verified policy v3 baseline
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          lane=full
          base=''
          proven=false

          if [[ "$RELEASE_EVENT" == push && "$RELEASE_REF" == refs/heads/main ]]; then
            php scripts/ci-release-proof.php baseline --head "$RELEASE_HEAD" > "$RUNNER_TEMP/release-baseline.json"
            base="$(jq -r '.base // empty' "$RUNNER_TEMP/release-baseline.json")"

            if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              php scripts/release-policy.php classify --base "$base" --head "$RELEASE_HEAD" > "$RUNNER_TEMP/release-policy.json"
              proposed="$(jq -r '.lane' "$RUNNER_TEMP/release-policy.json")"
              if [[ "$proposed" == documentation ]]; then
                if php scripts/release-policy.php assets --base "$base" --head "$RELEASE_HEAD" > "$RUNNER_TEMP/release-assets.json"; then
                  jq -e --arg base "$base" --arg head "$RELEASE_HEAD" '.equivalent == true and .base == $base and .head == $head' "$RUNNER_TEMP/release-assets.json" > /dev/null
                  lane=documentation
                  proven=true
                fi
              elif [[ "$proposed" == frontend ]]; then
                lane=frontend
                proven=true
              elif [[ "$proposed" != full ]]; then
                exit 1
              fi
            elif [[ -n "$base" ]]; then
              exit 1
            fi
          fi

          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base-proven=$proven" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate source and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reject invalid UTF-8 and mojibake
        run: php scripts/check-encoding.php

      - name: Reject Laravel keys introduced anywhere in commit history
        if: github.event_name != 'schedule'
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$SECRET_SCAN_BASE_SHA"

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          php scripts/check-secret-history.php --base="$base_sha"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all frontend dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

  documentation:
    name: 'Documentation checks (policy v3; base=${{ needs.classify.outputs.base }})'
    needs: classify
    if: needs.classify.outputs.lane == 'documentation' && needs.classify.outputs.base-proven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      TEST_TOKEN: ci-documentation
    steps:
      - name: Check out the exact release
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, zip
          coverage: none
      - name: Install locked verification dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Recheck unchanged frontend assets against the proven baseline
        env:
          RELEASE_BASE: ${{ needs.classify.outputs.base }}
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          php scripts/release-policy.php assets --base "$RELEASE_BASE" --head "$RELEASE_HEAD" > "$RUNNER_TEMP/documentation-assets.json"
          jq -e --arg base "$RELEASE_BASE" --arg head "$RELEASE_HEAD" '.equivalent == true and .base == $base and .head == $head' "$RUNNER_TEMP/documentation-assets.json" > /dev/null
      - name: Verify version syntax and formatting
        run: |
          php -l config/schooltool.php
          vendor/bin/pint config/schooltool.php --format agent
          git diff --exit-code
      - name: Exercise release-policy safety checks
        run: php vendor/bin/pest --compact tests/Unit/ReleasePolicyTest.php tests/Unit/CiReleaseProofTest.php tests/Unit/CiReleaseWorkflowTest.php tests/Unit/ChangedCodeCoverageGateTest.php

  frontend-proof:
    name: 'Frontend checks (policy v3; base=${{ needs.classify.outputs.base }})'
    needs: classify
    if: needs.classify.outputs.lane == 'frontend' && needs.classify.outputs.base-proven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact source and history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Recheck the frontend-only delta against the proven baseline
        env:
          RELEASE_BASE: ${{ needs.classify.outputs.base }}
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          php scripts/release-policy.php classify --base "$RELEASE_BASE" --head "$RELEASE_HEAD" > "$RUNNER_TEMP/frontend-policy.json"
          jq -e --arg base "$RELEASE_BASE" --arg head "$RELEASE_HEAD" '.lane == "frontend" and .base == $base and .head == $head' "$RUNNER_TEMP/frontend-policy.json" > /dev/null
          php -l config/schooltool.php

  php-quality:
    name: PHP formatting and static analysis
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP formatting in parallel
        run: |
          vendor/bin/pint --parallel --format agent
          git diff --exit-code

      - name: Run gradual static analysis
        run: composer analyse

  frontend:
    name: Frontend tests and release build
    needs: classify
    if: needs.classify.outputs.lane == 'full' || needs.classify.outputs.lane == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_DATABASE_TEST: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run complete frontend unit tests
        run: npm run test:ui

      - name: Build frontend
        run: npm run build

  php-tests:
    name: PHP sequential coverage
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pest_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pest_test
      DB_DATABASE_TEST: pest_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, pcntl, pdo_mysql, pdo_sqlite, posix, sodium, zip
          coverage: pcov

      - name: Create an empty CI environment file without credentials
        run: php -r "if (file_exists('.env') || !fclose(fopen('.env', 'x'))) { exit(1); }"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Run every PHP test in bounded sequential batches with coverage
        run: php scripts/ci-php-tests.php coverage

      - name: Enforce changed-code coverage
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$COVERAGE_BASE_SHA"

          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          php scripts/check-changed-code-coverage.php --base="$base_sha" --coverage=storage/logs/clover.xml --min=80

      - name: Preserve PHP test manifests, logs, and complete coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/logs/clover.xml
            storage/logs/ci-php-*/batch-*.json
            storage/logs/ci-php-*/batch-*.log
          retention-days: 14

  infrastructure:
    name: MySQL, Redis, and Horizon integration
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pest_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pest_test
      DB_DATABASE_TEST: pest_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_INTEGRATION_HOST: 127.0.0.1
      REDIS_INTEGRATION_PORT: 6379
      REDIS_INTEGRATION_DB: 15
      REDIS_INTEGRATION_PREFIX: 'schooltool-ci-integration:'

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, pcntl, pdo_mysql, posix, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Run MySQL and Redis integration tests
        run: composer test:integration

      - name: Verify Horizon starts with the segmented Redis queues
        env:
          QUEUE_CONNECTION: redis
          REDIS_QUEUE_CONNECTION: integration
          REDIS_DB: 14
          HORIZON_PREFIX: 'schooltool_ci_horizon:'
        run: |
          set -euo pipefail

          php artisan horizon > storage/logs/horizon-ci.log 2>&1 &
          horizon_pid=$!

          cleanup() {
            php artisan horizon:terminate >/dev/null 2>&1 || true
            kill "$horizon_pid" >/dev/null 2>&1 || true
            wait "$horizon_pid" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..20}; do
            if php artisan queue:health-check; then
              exit 0
            fi

            sleep 1
          done

          cat storage/logs/horizon-ci.log
          exit 1

  release-integrity:
    name: Verify commit-bound deployment release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/preview/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source and release commits
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify safe archive structure, source, and release parent
        run: |
          release_sha="$(git rev-parse HEAD)"
          php scripts/release-policy.php assets --base "$release_sha" --head "$release_sha"
          php scripts/frontend-release.php verify "$(git rev-parse HEAD^)"

  windows-workflow:
    name: Windows PowerShell workflow tests
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_DATABASE_TEST: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd, intl, pdo_sqlite, sockets, zip
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require both native PowerShell runtimes and Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          if ($LASTEXITCODE -ne 0) { throw 'Git is unavailable.' }
          powershell -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -ne 5) { exit 1 }'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 is unavailable.' }
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 is unavailable.' }
          if (-not (Test-Path -LiteralPath 'C:/Program Files/Git/bin/bash.exe')) { throw 'Git Bash is unavailable.' }
      - name: Create an empty CI environment file without credentials
        run: php -r "if (file_exists('.env') || !fclose(fopen('.env', 'x'))) { exit(1); }"
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked frontend tools required by native workflow fixtures
        run: npm ci
      - name: Run Windows workflow tests without connecting to a database or server
        run: php scripts/ci-php-tests.php windows
      - name: Preserve Windows workflow test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/logs/ci-php-*
          retention-days: 14

  release-approval:
    name: Release approval (policy v3)
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - classify
      - documentation
      - frontend-proof
      - php-quality
      - frontend
      - php-tests
      - infrastructure
      - windows-workflow
      - release-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every release gate
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RELEASE_INTEGRITY_RESULT: ${{ needs.release-integrity.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RELEASE_LANE: ${{ needs.classify.outputs.lane }}
          BASE_PROVEN: ${{ needs.classify.outputs.base-proven }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          FRONTEND_PROOF_RESULT: ${{ needs.frontend-proof.result }}
          PHP_QUALITY_RESULT: ${{ needs.php-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PHP_TESTS_RESULT: ${{ needs.php-tests.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          WINDOWS_WORKFLOW_RESULT: ${{ needs.windows-workflow.result }}
        run: |
          set -euo pipefail

          for result in \
            "$VALIDATE_RESULT" \
            "$CLASSIFY_RESULT" \
            "$RELEASE_INTEGRITY_RESULT"; do
            test "$result" = "success"
          done

          case "$RELEASE_LANE" in
              full)
                test "$DOCUMENTATION_RESULT" = "skipped"
                test "$FRONTEND_PROOF_RESULT" = "skipped"
              for result in "$PHP_QUALITY_RESULT" "$FRONTEND_RESULT" "$PHP_TESTS_RESULT" "$INFRASTRUCTURE_RESULT" "$WINDOWS_WORKFLOW_RESULT"; do
                test "$result" = "success"
              done
              ;;
              documentation)
                test "$BASE_PROVEN" = "true"
                test "$DOCUMENTATION_RESULT" = "success"
                test "$FRONTEND_PROOF_RESULT" = "skipped"
              for result in "$PHP_QUALITY_RESULT" "$FRONTEND_RESULT" "$PHP_TESTS_RESULT" "$INFRASTRUCTURE_RESULT" "$WINDOWS_WORKFLOW_RESULT"; do
                test "$result" = "skipped"
                done
                ;;
              frontend)
                test "$BASE_PROVEN" = "true"
                test "$DOCUMENTATION_RESULT" = "skipped"
                test "$FRONTEND_PROOF_RESULT" = "success"
                test "$FRONTEND_RESULT" = "success"
                for result in "$PHP_QUALITY_RESULT" "$PHP_TESTS_RESULT" "$INFRASTRUCTURE_RESULT" "$WINDOWS_WORKFLOW_RESULT"; do
                  test "$result" = "skipped"
                done
                ;;
            *) exit 1 ;;
          esac

          echo "Exact release passed policy v3 ($RELEASE_LANE)."
