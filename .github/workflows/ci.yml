name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reject invalid UTF-8 and mojibake
        run: php scripts/check-encoding.php

      - name: Reject Laravel keys introduced anywhere in commit history
        if: github.event_name != 'schedule'
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$SECRET_SCAN_BASE_SHA"

          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          php scripts/check-secret-history.php --base="$base_sha"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production frontend dependencies
        if: github.event_name != 'push'
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all frontend dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

  php-quality:
    name: PHP formatting and static analysis
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP formatting in parallel
        run: |
          vendor/bin/pint --parallel --format agent
          git diff --exit-code

      - name: Run gradual static analysis
        run: composer analyse

  frontend:
    name: Frontend tests and release build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run complete frontend unit tests
        run: npm run test:ui

      - name: Build frontend
        run: npm run build

  php-tests:
    name: PHP parallel coverage
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pest_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pest_test
      DB_DATABASE_TEST: pest_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, pcntl, pdo_mysql, posix, zip
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Run PHP tests with parallel coverage
        run: php artisan test --compact --exclude-group=integration --parallel --processes=2 --recreate-databases --coverage-clover=storage/logs/clover.xml

      - name: Enforce changed-code coverage
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$COVERAGE_BASE_SHA"

          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          php scripts/check-changed-code-coverage.php --base="$base_sha" --coverage=storage/logs/clover.xml --min=80

  infrastructure:
    name: MySQL, Redis, and Horizon integration
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pest_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pest_test
      DB_DATABASE_TEST: pest_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_INTEGRATION_HOST: 127.0.0.1
      REDIS_INTEGRATION_PORT: 6379
      REDIS_INTEGRATION_DB: 15
      REDIS_INTEGRATION_PREFIX: 'schooltool-ci-integration:'

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, pcntl, pdo_mysql, posix, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Run MySQL and Redis integration tests
        run: composer test:integration

      - name: Verify Horizon starts with the segmented Redis queues
        env:
          QUEUE_CONNECTION: redis
          REDIS_QUEUE_CONNECTION: integration
          REDIS_DB: 14
          HORIZON_PREFIX: 'schooltool_ci_horizon:'
        run: |
          set -euo pipefail

          php artisan horizon > storage/logs/horizon-ci.log 2>&1 &
          horizon_pid=$!

          cleanup() {
            php artisan horizon:terminate >/dev/null 2>&1 || true
            kill "$horizon_pid" >/dev/null 2>&1 || true
            wait "$horizon_pid" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..20}; do
            if php artisan queue:health-check; then
              exit 0
            fi

            sleep 1
          done

          cat storage/logs/horizon-ci.log
          exit 1

  release-integrity:
    name: Verify commit-bound deployment release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source and release commits
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify source, archive, and release parent
        run: php scripts/frontend-release.php verify "$(git rev-parse HEAD^)"

  ready:
    name: READY — CI verified Cloudways release
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - php-quality
      - frontend
      - php-tests
      - infrastructure
      - release-integrity
    runs-on: ubuntu-latest

    steps:
      - name: Require every release gate
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RELEASE_INTEGRITY_RESULT: ${{ needs.release-integrity.result }}
        run: |
          set -euo pipefail

          for result in \
            "$VALIDATE_RESULT" \
            "$RELEASE_INTEGRITY_RESULT"; do
            test "$result" = "success"
          done

          echo "Cloudways release verified."
