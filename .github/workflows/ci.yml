name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pest_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pest_test
      DB_DATABASE_TEST: pest_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_INTEGRATION_HOST: 127.0.0.1
      REDIS_INTEGRATION_PORT: 6379
      REDIS_INTEGRATION_DB: 15
      REDIS_INTEGRATION_PREFIX: 'schooltool-ci-integration:'

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, pcntl, pdo_mysql, posix, zip
          coverage: pcov

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Reject invalid UTF-8 and mojibake
        run: php scripts/check-encoding.php

      - name: Reject Laravel keys introduced anywhere in commit history
        if: github.event_name != 'schedule'
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$SECRET_SCAN_BASE_SHA"

          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          php scripts/check-secret-history.php --base="$base_sha"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        shell: bash
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all frontend dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Check PHP formatting
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code

      - name: Run gradual static analysis
        run: composer analyse

      - name: Run frontend unit tests
        run: npm run test:ui

      - name: Build frontend
        run: npm run build

      - name: Upload frontend deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 7

      - name: Run PHP tests with coverage
        run: php artisan test --compact --exclude-group=integration --coverage-clover=storage/logs/clover.xml

      - name: Enforce changed-code coverage
        if: github.event_name != 'schedule'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$COVERAGE_BASE_SHA"

          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          php scripts/check-changed-code-coverage.php --base="$base_sha" --coverage=storage/logs/clover.xml --min=80

      - name: Run MySQL and Redis integration tests
        run: composer test:integration

      - name: Verify Horizon starts with the segmented Redis queues
        env:
          QUEUE_CONNECTION: redis
          REDIS_QUEUE_CONNECTION: integration
          REDIS_DB: 14
          HORIZON_PREFIX: 'schooltool_ci_horizon:'
        run: |
          set -euo pipefail

          php artisan horizon > storage/logs/horizon-ci.log 2>&1 &
          horizon_pid=$!

          cleanup() {
            php artisan horizon:terminate >/dev/null 2>&1 || true
            kill "$horizon_pid" >/dev/null 2>&1 || true
            wait "$horizon_pid" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..20}; do
            if php artisan horizon:status | grep -qi "running"; then
              exit 0
            fi

            sleep 1
          done

          cat storage/logs/horizon-ci.log
          exit 1

  publish-cloudways:
    name: Publish Cloudways release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download verified frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-build

      - name: Publish commit-bound Cloudways release
        shell: bash
        run: |
          set -euo pipefail

          publish_directory="$RUNNER_TEMP/cloudways-release-branch"
          git worktree add --detach "$publish_directory" "$GITHUB_SHA"
          cd "$publish_directory"

          git switch -C cloudways
          mkdir -p deployment
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/frontend-build/deployment-source.txt"
          tar -czf deployment/frontend-build.tar.gz -C "$RUNNER_TEMP/frontend-build" .
          printf '%s\n' "$GITHUB_SHA" > deployment/source-commit

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f deployment/frontend-build.tar.gz deployment/source-commit
          git commit -m "Build Cloudways release for ${GITHUB_SHA}"
          git push --force origin HEAD:cloudways
