name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pest_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pest_test
      DB_DATABASE_TEST: pest_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      PULSE_ENABLED: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_INTEGRATION_HOST: 127.0.0.1
      REDIS_INTEGRATION_PORT: 6379
      REDIS_INTEGRATION_DB: 15
      REDIS_INTEGRATION_PREFIX: 'schooltool-ci-integration:'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, pcntl, pdo_mysql, posix, zip
          coverage: pcov

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reject invalid UTF-8 and mojibake
        run: php scripts/check-encoding.php

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral application key
        shell: bash
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi --no-interaction)" >> "$GITHUB_ENV"

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all frontend dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Check PHP formatting
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code

      - name: Run frontend unit tests
        run: npm run test:ui

      - name: Build frontend
        run: npm run build

      - name: Run PHP tests with coverage
        run: php artisan test --compact --exclude-group=integration --coverage-clover=storage/logs/clover.xml

      - name: Enforce changed-code coverage
        if: github.event_name != 'schedule'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check-changed-code-coverage.php --base="$COVERAGE_BASE_SHA" --coverage=storage/logs/clover.xml --min=80

      - name: Run MySQL and Redis integration tests
        run: composer test:integration

      - name: Verify Horizon starts with the segmented Redis queues
        env:
          QUEUE_CONNECTION: redis
          REDIS_QUEUE_CONNECTION: integration
          REDIS_DB: 14
          HORIZON_PREFIX: 'schooltool_ci_horizon:'
        run: |
          set -euo pipefail

          php artisan horizon > storage/logs/horizon-ci.log 2>&1 &
          horizon_pid=$!

          cleanup() {
            php artisan horizon:terminate >/dev/null 2>&1 || true
            kill "$horizon_pid" >/dev/null 2>&1 || true
            wait "$horizon_pid" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..20}; do
            if php artisan horizon:status | grep -qi "running"; then
              exit 0
            fi

            sleep 1
          done

          cat storage/logs/horizon-ci.log
          exit 1
